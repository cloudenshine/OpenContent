schema: opencontent.capability-pack.v1

id: narrative
name: Narrative Creation
version: 1.0.0

description: >
  Full-lifecycle narrative production line: market intelligence (long & short scans),
  story deconstruction & mechanism extraction, planning, drafting, continuation,
  surgical revision, independent critique, and cover presentation.

profiles:
  - general-fiction
  - serial-fiction
  - narrative-nonfiction

tasks:
  - long-scan
  - short-scan
  - long-analyze
  - short-analyze
  - plan
  - write
  - continue
  - revise
  - critique
  - cover

runtime:
  tools: required
  workspace_write: required
  session: optional
  web: optional

workflows:
  long-scan: workflows/long-scan.yaml
  short-scan: workflows/short-scan.yaml
  long-analyze: workflows/long-analyze.yaml
  short-analyze: workflows/short-analyze.yaml
  plan: workflows/plan.yaml
  write: workflows/write.yaml
  continue: workflows/continue.yaml
  revise: workflows/revise.yaml
  critique: workflows/critique.yaml
  cover: workflows/cover.yaml

context:
  selector: context/selector.py

outputs:
  - artifact
  - proposal
  - state_delta
  - review
  - market_report
  - mechanism_cards
  - cover_spec
