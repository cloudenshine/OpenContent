id: short-scan
name: Short Fiction Imported Snapshot Analysis
description: Analyze explicit provenance-bearing short-fiction records. No verified public short-ranking adapter is currently available; requesting one fails visibly instead of substituting long fiction or samples.

steps:
  - id: resolve_explicit_input
    description: Require raw_data or a Vault-relative market_input_path; label all imported URLs and observation times as user-supplied and unverified.
  - id: apply_quality_gate
    description: Require at least 2 distinct valid records per platform, each with title, positive rank, public URL and timezone-aware observed_at. Reject invalid fields and duplicates.
  - id: summarize_supplied_annotations
    description: Count explicitly supplied emotional_hook and reversal_type annotations. Missing fields stay unknown; do not invent emotional patterns or promise commercial performance.
  - id: document_uncertainty
    description: Treat creative directions as hypotheses. A single snapshot does not establish saturation, completion/share rates or 30-60-day trend shelf-life.

outputs:
  - market_report: Reviewable MarketRunShort v2 report and normalized records with source verification status, observation timestamps separate from analysis time, field coverage, quality details and limitations.
