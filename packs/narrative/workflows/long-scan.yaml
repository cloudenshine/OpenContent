id: long-scan
name: Long Fiction Ranking Snapshot Analysis
description: Analyze an explicitly selected, bounded public Qimao daily ranking snapshot or provenance-bearing imported records. Other platforms require imported data; there is no sample fallback.

steps:
  - id: resolve_explicit_input
    description: Require source_ids (qimao-boy-hot-daily or qimao-girl-hot-daily), raw_data, or a Vault-relative market_input_path. Imports are user-supplied and unverified.
  - id: collect_or_validate_snapshot
    description: Respect robots rules; fetch only allowlisted HTTPS pages with size and timeout bounds, rejecting redirects and blocked/changed pages. Require title, positive rank, public URL and timezone-aware observed_at for every record.
  - id: apply_quality_gate
    description: Require at least 3 distinct valid records per platform. Reject invalid data or duplicate books/ranks instead of inventing fields or inflating counts.
  - id: summarize_observed_samples
    description: Count only supplied genre/tag fields; mark creative directions as hypotheses. Do not claim revenue, completion rate, market saturation or trend lifetime from a snapshot.

outputs:
  - market_report: Reviewable MarketRunLong v2 report with normalized records, observation timestamps separate from analysis time, source verification status, source snapshots/hashes, quality details and limitations.
