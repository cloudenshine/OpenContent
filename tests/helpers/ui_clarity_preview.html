<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>OpenContent 界面验收与预览</title><link rel="stylesheet" href="/plugin.css">
<style>
:root{--font-text:system-ui,"Microsoft YaHei",sans-serif;--background-primary:#fff;--background-secondary:#f7f8fa;--background-modifier-border:#e4e6eb;--background-modifier-hover:#f0f3f9;--text-normal:#202632;--text-muted:#687180;--interactive-accent:#3865c9;--text-accent:#3865c9;--text-on-accent:#fff;--text-error:#b93838;--color-green:#257c51;--color-orange:#a7671c;--color-purple:#7150a7;--color-blue-rgb:56,101,201;--color-purple-rgb:113,80,167}
*{box-sizing:border-box}body{margin:0;font-family:var(--font-text);color:var(--text-normal);background:#edf0f5}body.dark{--background-primary:#171c25;--background-secondary:#202735;--background-modifier-border:#364151;--background-modifier-hover:#283750;--text-normal:#e6ebf2;--text-muted:#aab4c5;--interactive-accent:#7099ef;--text-accent:#92b2f8;--color-green:#73c49b;--color-orange:#e9b477;background:#11151c}
.preview-host{max-width:1080px;margin:auto;background:var(--background-primary);min-height:100vh}.preview-label{padding:10px 24px;color:var(--text-muted);font-size:11px;background:var(--background-secondary);border-bottom:1px solid var(--background-modifier-border)}button,input,textarea,select{font:inherit;color:inherit}button,select,input,textarea{border:1px solid var(--background-modifier-border);border-radius:7px;background:var(--background-primary)}button{min-height:34px;padding:7px 12px;cursor:pointer}button:disabled{opacity:.5;cursor:not-allowed}button.mod-cta{background:var(--interactive-accent);border-color:var(--interactive-accent);color:var(--text-on-accent)}input,select,textarea{padding:9px;max-width:100%}textarea{width:100%;resize:vertical}iframe{width:100%;min-height:260px;border:1px solid var(--background-modifier-border)}.preview-overlay{position:fixed;inset:0;background:#0005;display:grid;place-items:center;z-index:100}.preview-dialog{background:var(--background-primary);border-radius:12px;padding:20px;width:min(700px,95vw);max-height:90vh;overflow:auto}.preview-notice{position:fixed;right:12px;bottom:12px;max-width:450px;background:var(--background-primary);border:1px solid var(--background-modifier-border);border-radius:10px;padding:12px;z-index:101}
</style>
<div class="preview-host"><div class="preview-label">界面验收预览 · 真实插件界面和临时内核 · 模型及 Obsidian 宿主使用测试替身</div><main id="cockpit"></main></div>
<script>
HTMLElement.prototype.empty=function(){this.replaceChildren()};HTMLElement.prototype.addClass=function(...names){this.classList.add(...names)};
window.module={exports:{}};window.uiCalls=[];window.uiNotices=[];
class PreviewItemView{constructor(leaf){this.app=leaf.app;this.contentEl=document.querySelector('#cockpit')}}
class PreviewModal{constructor(app){this.app=app;this.overlay=document.createElement('div');this.overlay.className='preview-overlay';this.contentEl=document.createElement('div');this.contentEl.className='preview-dialog';this.overlay.append(this.contentEl)}open(){document.body.append(this.overlay);this.onOpen();this.overlay.addEventListener('click',e=>{if(e.target===this.overlay)this.close()})}close(){this.onClose();this.overlay.remove()}}
class PreviewNotice{constructor(text){window.uiNotices.push(text);const n=document.createElement('div');n.className='preview-notice';n.textContent=text;document.body.append(n);setTimeout(()=>n.remove(),4000)}}
window.require=name=>name==='obsidian'?{Plugin:class{},PluginSettingTab:class{},ItemView:PreviewItemView,Modal:PreviewModal,Notice:PreviewNotice,sanitizeHTMLToDom:html=>{const t=document.createElement('template');t.innerHTML=html;return t.content}}:name==='crypto'?{createHash:()=>({update(){return this},digest:()=>''})}:{};
</script><script src="/plugin.js"></script><script>
(async()=>{
window.fixture=await(await fetch('/fixture')).json();
const app={vault:{adapter:{getBasePath:()=>'/synthetic',read:async()=>'',readBinary:async()=>new ArrayBuffer(0)},getAbstractFileByPath:()=>null,getFiles:()=>[],getMarkdownFiles:()=>[]},workspace:{getActiveFile:()=>null}};
window.plugin={app,settings:{viewMode:'simple',typographyTheme:'serif',reviewer:'界面验收人员',lastProject:fixture.project,lastArtifact:fixture.second},connection:{},remember:async()=>{},saveData:async()=>{},openNote:async path=>{window.lastOpenedNote=path;new Notice('已在编辑器打开：'+path)},configure:()=>new Notice('打开连接设置'),api:async(route,body)=>{uiCalls.push({route,body});const res=await fetch('/api'+route,{method:body===undefined?'GET':'POST',headers:{'Content-Type':'application/json'},body:body===undefined?undefined:JSON.stringify(body)});const out=await res.json();if(!res.ok)throw Error(out.error);return out}};
window.Cockpit=eval('Cockpit');window.view=new Cockpit({app},plugin);view.tab='project';await view.render();window.previewReady=true;
window.go=async(tab,artifact=fixture.second)=>{view.tab=tab;view.selected=fixture.project;view.artifact=artifact;await view.render()};
})().catch(error=>{document.querySelector('#cockpit').textContent=error.stack;window.previewError=error.message});
</script></html>
